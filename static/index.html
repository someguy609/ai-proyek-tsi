<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Camera Viewer</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .app {
            display: grid;
            gap: 4px;
        }

        .camera-box {
            width: 480px;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }

        video {
            width: 100%;
            height: auto;
            background: black;
        }

        button {
            margin-top: 10px;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            background: #06f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0090ff;
        }
    </style>
</head>

<body>
    <div id="app" class="app"></div>

    <script src="/static/client.js"></script>
</body>
</html>
